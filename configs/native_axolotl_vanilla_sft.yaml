# Native Axolotl control: no tokenizer/preprocessing hook. The locked v0.4.0
# ShareGPT strategy owns labels unchanged (\n\n + assistant body + EOT + EOS).
base_model: /path/to/models/Meta-Llama-3-8B
model_type: LlamaForCausalLM
tokenizer_type: AutoTokenizer

load_in_8bit: false
load_in_4bit: false
strict: false

datasets:
  - path: /path/to/datasets/Magpie-Pro-100K/data.jsonl
    ds_type: json
    type: sharegpt
    conversation: llama3
dataset_prepared_path: /path/to/VAT-LLM/prepared/magpie_llama3_native_axolotl_v0p4p0_8192_seed42
val_set_size: 0.001
output_dir: /path/to/VAT-LLM/checkpoints/native_axolotl/vanilla_sft
run_name: vat_llm_native_axolotl_vanilla_sft

sequence_len: 8192
sample_packing: true
eval_sample_packing: false
pad_to_sequence_len: true

gradient_accumulation_steps: 8
micro_batch_size: 1
eval_batch_size: 1
num_epochs: 2
optimizer: paged_adamw_8bit
lr_scheduler: cosine
learning_rate: 2.0e-5

train_on_inputs: false
group_by_length: false
bf16: auto
fp16:
tf32: false

gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
flash_attention: true
xformers_attention:

warmup_steps: 100
evals_per_epoch: 3
saves_per_epoch: 1
logging_steps: 1
weight_decay: 0.0
seed: 42
save_safetensors: true
special_tokens:
  pad_token: <|end_of_text|>

native_axolotl_preprocessing: true
use_vat: false
