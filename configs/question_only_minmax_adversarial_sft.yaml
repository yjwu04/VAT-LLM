base_model: /path/to/models/Meta-Llama-3-8B
model_type: LlamaForCausalLM
tokenizer_type: AutoTokenizer
load_in_8bit: false
load_in_4bit: false
strict: false
datasets:
- path: /path/to/datasets/Magpie-Pro-100K/data.jsonl
  ds_type: json
  type: sharegpt
  conversation: llama3
dataset_prepared_path: /path/to/VAT-LLM/prepared/magpie_llama3_body_only_v1_8192_seed42
val_set_size: 0.001
output_dir: /path/to/VAT-LLM/checkpoints/minmax_adversarial_sft/main
run_name: vat_llm_question_only_minmax_adversarial_sft_main
sequence_len: 8192
sample_packing: true
eval_sample_packing: false
pad_to_sequence_len: true
gradient_accumulation_steps: 8
micro_batch_size: 1
eval_batch_size: 1
num_epochs: 2
optimizer: paged_adamw_8bit
lr_scheduler: cosine
learning_rate: 2.0e-05
train_on_inputs: false
group_by_length: false
bf16: auto
fp16: null
tf32: false
gradient_checkpointing: true
gradient_checkpointing_kwargs:
