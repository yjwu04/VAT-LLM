flash_attention: true
xformers_attention: null
warmup_steps: 100
evals_per_epoch: 3
save_strategy: steps
save_steps: 68
save_total_limit: 1
logging_steps: 1
weight_decay: 0.0
seed: 42
save_safetensors: true
special_tokens:
  pad_token: <|end_of_text|>
use_vat: false
use_minmax_adversarial_sft: true
minmax_rho: 0.03
